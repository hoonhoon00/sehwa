<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="1997년 11월 14일, 세화고등학교 야간자율학습실에 종이 열세 번 울렸다.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>세화고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@400;700&family=Dokdo&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 검은 밤의 학교 위로 한 줄짜리 세로 기둥. 스크롤을 내릴 때마다 문장이 하나씩 떠오르고, 선택하면 다음 장면이 아래로 이어진다. */
:root {
  --bg: #08080a;
  --bg-2: #141417;
  --line: #2a2a30;
  --text: #dad9d3;
  --dim: #85847d;
  --paper: #d9d6ca;
  --paper-line: #c3c0b3;
  --ink: #1f1f22;
  --ink-blue: #2a4c9b;
  --red: #b4372f;
  --dh: #8fb2d6;
  --jh: #dcb87f;
  --exit: #5fae7d;
  --f-body: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
  --f-dh: "Dokdo", "Nanum Myeongjo", cursive;
  --f-jh: "Gaegu", "Nanum Myeongjo", cursive;
  --f-sys: "Nanum Gothic Coding", "D2Coding", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--text); font-family: var(--f-body); font-size: 17px; line-height: 1.85; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(4px); border-bottom: 1px solid var(--line); }
.bar-in {
  max-width: 720px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  font-family: var(--f-sys); font-size: 12.5px; letter-spacing: .06em; color: var(--dim);
}
.bar .place { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .clock { color: var(--exit); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; letter-spacing: .1em; }
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(230,235,224,.5), transparent); animation: flick 7s infinite steps(1); }
@keyframes flick { 0%,100%{opacity:.7} 41%{opacity:.1} 42%{opacity:.8} 43%{opacity:.15} 44%{opacity:.7} 88%{opacity:.6} 89%{opacity:0} 90%{opacity:.7} }

main {
  max-width: 720px; margin: 0 auto; padding-block: 48px 40vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scene { display: flex; flex-direction: column; gap: clamp(30px, 9vh, 84px); scroll-margin-top: 70px; padding-top: 12px; }
.scene + .scene { margin-top: clamp(60px, 16vh, 140px); }
.scene p { margin: 0; max-width: 62ch; text-wrap: pretty; }
.scene-mark { font-family: var(--f-sys); font-size: 12px; letter-spacing: .18em; color: var(--dim); border-top: 1px solid var(--line); padding-top: 12px; }

/* 스크롤 등장 */
.rv { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
.rv.in { opacity: 1; transform: none; }
.no-io .rv { opacity: 1; transform: none; }

/* 인트로 */
.intro { display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--f-body); font-weight: 800; margin: 0; font-size: clamp(38px, 9vw, 60px); line-height: 1.15; letter-spacing: -.02em; }
.small { font-size: 14px; color: var(--dim); }
.field { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.field label { font-family: var(--f-sys); font-size: 12.5px; letter-spacing: .1em; color: var(--dim); }
.field-row { display: flex; gap: 10px; flex-wrap: wrap; }
input#pname { flex: 1 1 200px; min-width: 0; font: 700 18px var(--f-body); color: var(--ink); background: var(--paper); border: 0; border-radius: 2px; padding: 12px 14px; }
input#pname:focus-visible { outline: 2px solid var(--exit); outline-offset: 2px; }
input#pname:disabled { opacity: .7; }
.warn { font-family: var(--f-sys); font-size: 12.5px; color: #e3a49d; min-height: 1.4em; }
.btn { font: 700 15px var(--f-sys); letter-spacing: .08em; background: transparent; color: var(--text); border: 1px solid var(--dim); border-radius: 2px; padding: 12px 18px; cursor: pointer; }
.btn:hover { background: var(--bg-2); border-color: var(--text); }
.btn:focus-visible { outline: 2px solid var(--exit); outline-offset: 2px; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { background: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.endings { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.endings div { font-family: var(--f-sys); font-size: 12.5px; padding: 8px 10px; border: 1px dashed var(--line); color: var(--dim); }
.endings div.got { border-style: solid; color: var(--text); }
.endings b { color: var(--red); margin-right: 6px; }
.label { font-family: var(--f-sys); font-size: 12px; letter-spacing: .14em; color: var(--dim); }

/* 대사 */
.say { display: grid; grid-template-columns: 4.6em minmax(0,1fr); gap: 12px; align-items: baseline; }
.say .who { font-family: var(--f-sys); font-size: 13px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say .line { margin: 0; }
.say.dh .who { color: var(--dh); } .say.dh .line { color: color-mix(in srgb, var(--dh) 35%, var(--text)); }
.say.jh .who { color: var(--jh); } .say.jh .line { color: color-mix(in srgb, var(--jh) 35%, var(--text)); }
.say.me .who { color: var(--text); }

.sys { font-family: var(--f-sys); font-size: 14.5px; line-height: 1.75; color: #e3a49d; padding: 12px 14px; background: repeating-linear-gradient(0deg, rgba(180,55,47,.07) 0 2px, transparent 2px 4px); border: 1px solid rgba(180,55,47,.38); }
.sys .tag { display: block; font-size: 11.5px; letter-spacing: .24em; color: var(--red); margin-bottom: 4px; }
.sys .jit { display: inline-block; animation: jit 3.2s infinite; }
@keyframes jit { 0%,92%,100%{transform:none} 93%{transform:translateX(1px)} 95%{transform:translateX(-2px)} 97%{transform:translateX(1px)} }
.voice { font-family: var(--f-sys); font-size: 14.5px; color: var(--dim); letter-spacing: .12em; }

/* 종이 */
.paper { background: var(--paper); color: var(--ink); padding: 22px; border-radius: 1px; box-shadow: 0 18px 40px -14px rgba(0,0,0,.9); max-width: 62ch; }
.official .head { display: flex; gap: 14px; align-items: center; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 12px; }
.seal { flex: none; width: 52px; height: 52px; color: var(--ink); --crest-hole: var(--paper); }
.seal svg, .crest svg { display: block; width: 100%; height: 100%; }
.crest { width: 104px; height: 104px; color: var(--text); opacity: .92; --crest-hole: var(--bg); }
.official .dept { font-family: var(--f-sys); font-size: 11.5px; letter-spacing: .06em; color: #55534b; }
.official h3 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.35; }
.official ol { margin: 0; padding-left: 1.5em; font-size: 15px; line-height: 1.75; display: flex; flex-direction: column; gap: 6px; }
.official .foot { margin-top: 12px; font-family: var(--f-sys); font-size: 11px; color: #6a685e; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.official .glitch s { color: #6a685e; }
.official .glitch ins { text-decoration: none; color: var(--red); font-weight: 700; }

/* 손글씨 쪽지: 연습장 한 장 */
.note {
  position: relative; padding: 26px 22px 22px;
  background: repeating-linear-gradient(180deg, transparent 0 35px, var(--paper-line) 35px 36px), var(--paper);
  background-position: 0 14px;
  transform: rotate(.4deg);
  display: flex; flex-direction: column; gap: 0;
}
.note::before { content: ""; position: absolute; top: -9px; left: 50%; width: 92px; height: 20px; transform: translateX(-50%) rotate(-2deg); background: rgba(235,230,210,.55); }
.note p { margin: 0; line-height: 36px; }
.h-dh { font-family: var(--f-dh); font-size: 27px; color: var(--ink); letter-spacing: .01em; }
.h-jh { font-family: var(--f-jh); font-size: 21px; color: var(--ink-blue); }
.h-jh.side { font-size: 18px; display: inline-block; transform: rotate(-1.5deg); }
.side-dh { display: inline-block; margin-left: 2.4em; transform: rotate(2.5deg); }
.sig { display: block; text-align: right; }

.roll { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.roll caption { text-align: left; font-weight: 800; font-size: 15px; padding-bottom: 8px; }
.roll th, .roll td { border: 1px solid #8f8c7d; padding: 6px 8px; text-align: left; }
.roll th { font-family: var(--f-sys); font-size: 11.5px; font-weight: 400; background: rgba(0,0,0,.05); }
.roll .red { color: var(--red); font-weight: 700; }
.roll .fresh td { background: rgba(180,55,47,.09); }
.table-wrap { overflow-x: auto; }

/* 선택지 */
.choices { list-style: none; margin: 0; padding: 14px 0 0; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); }
.choices .q { font-family: var(--f-sys); font-size: 12px; letter-spacing: .14em; color: var(--dim); margin-bottom: 6px; }
.choice { width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: 1.8em minmax(0,1fr); gap: 8px; align-items: baseline; font: 400 16.5px/1.6 var(--f-body); color: var(--text); background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 12px 8px; }
.choice:hover:not(:disabled) { background: var(--bg-2); }
.choice:focus-visible { outline: 2px solid var(--exit); outline-offset: -2px; }
.choice .num { font-weight: 800; color: var(--dim); }
.choice.special, .choice.special .num { color: var(--jh); }
.choice:disabled { cursor: default; opacity: .28; }
.choice.picked:disabled { opacity: 1; color: var(--text); }
.choice.picked .num { color: var(--red); }

.ending { position: relative; background: var(--paper); color: var(--ink); padding: 22px; max-width: 62ch; }
.ending .k { font-family: var(--f-sys); font-size: 11.5px; letter-spacing: .14em; color: #55534b; }
.ending h2 { margin: 4px 0 6px; font-size: 24px; font-weight: 800; line-height: 1.3; padding-right: 84px; }
.ending .cnt { font-family: var(--f-sys); font-size: 13px; }
.stamp { position: absolute; top: 16px; right: 16px; width: 70px; height: 70px; border-radius: 50%; border: 3px double var(--red); color: var(--red); display: grid; place-items: center; text-align: center; font: 800 14px/1.15 var(--f-body); transform: rotate(-12deg); opacity: .85; }
.end-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.ending .btn { color: var(--ink); border-color: var(--ink); }
.ending .btn:hover { background: rgba(0,0,0,.08); }
.ending .btn.primary { background: var(--ink); color: var(--paper); }
.ending .btn.primary:hover { background: #000; }
.ending .btn:focus-visible { outline-color: var(--ink); }

.hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4; font-family: var(--f-sys); font-size: 12px; letter-spacing: .2em; color: var(--dim); pointer-events: none; transition: opacity .4s; animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 0%,100%{ translate: 0 0 } 50%{ translate: 0 5px } }
.disclaimer { font-family: var(--f-sys); font-size: 11.5px; color: var(--dim); }
.tape { font-family: var(--f-sys); font-size: 14.5px; color: var(--dim); }
.tape .tag { font-size: 11.5px; letter-spacing: .2em; margin-right: 8px; color: var(--jh); }
.rule { background: var(--paper); color: var(--ink); padding: 14px 18px; max-width: 62ch; font-size: 15px; border-top: 2px solid var(--ink); }
.rule .dept { display: block; font-family: var(--f-sys); font-size: 11px; color: #55534b; margin-bottom: 4px; }
.roll .mine td { background: rgba(180,55,47,.1); }
.roll .mine .hand { font-family: var(--f-jh); font-size: 17px; color: var(--red); }

@media (max-width: 460px) {
  body { font-size: 16px; }
  .say { grid-template-columns: 1fr; gap: 0; }
  .say .who { text-align: left; }
  .paper { padding: 18px 16px; }
  .endings { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .rv { transform: none; transition: opacity .3s; }
  .bar::after, .sys .jit, .hint { animation: none; }
}
</style>

</head>
<body>
<div class="bar"><div class="bar-in">
  <span class="place" id="place">세화고등학교</span>

</div></div>

<main id="app"></main>
<div class="hint" id="hint" hidden>▾ 스크롤</div>

<script>
(function () {
  const ENDINGS = { e1: "아침이 오지 않는 자습실", e2: "혼자 내려간 계단", e5: "한 명만 보이는 밤", e3: "귀가", e4: "함께 귀가" };

  }

  const DOCS = {
    A: (glitch) => `
<div class="paper official">
  <div class="head"><div class="seal">${LOGO()}</div>
    <div><div class="dept">세화고등학교 생활안전부 · 생안-2026-047</div><h3>야간자율학습실 이용 수칙</h3></div></div>

    <li>야간자율학습은 22시 00분에 종료됩니다. 종이 열세 번 울렸다면 당신은 종료 시각을 놓친 것입니다. <b>자리에서 일어나지 마십시오.</b></li>

    B: () => `
<div class="paper note">
  <p class="h-dh">이거 읽고 있으면 잘 봐.</p>

    C: (name) => `
<div class="paper official">

    D: (name) => `

      <tr><td>1998.11.14</td><td>이○○</td><td>수칙 1–3 작성. 종이 열세 번 울렸다.</td></tr>
      <tr><td>2004.11.14</td><td>박○○</td><td>수칙 4 추가. 별관 문은 열려 있지 않다.</td></tr>

      { p: "내 글씨다." },
      { sys: "{n} 학생. 그 둘은 본교 학생이 아닙니다. 그 둘의 말을 듣지 마십시오." },
      { p: "이번에는 알아듣는다. 오늘 밤 내내 귀에 익던 그 목소리." },
      { p: "내 목소리다." },
      { s: "dh", x: "이제 알겠지. 생활안전부 같은 건 없어. 저 수칙 쓰는 건 여기 남은 애들이야. 남으면 다음 애를 붙잡으려고 저걸 쓰게 돼." },
      { s: "jh", x: "그래서 저희가 쪽지를 썼어요. 반대로. 저희는 저쪽이 되기 싫었거든요." },
      { s: "dh", x: "저건 아직 네가 아니야. 네가 앉아 있었으면 됐을 너지. 아직은." },
      { p: "스피커 속의 내가 숫자를 세기 시작한다. 하나. 둘." },
      { s: "dh", x: "믹서는 내가 잡을게. 이런 건 밴드부가 제일 잘 알아. 지훈아, 큐 줘." },
      { s: "jh", x: "형이 옆에 있으면요." },
      { p: "도훈이 대답 대신 지훈의 머리를 한 번 툭 친다. 있잖아, 계속. 그렇게 말하는 것처럼." }
    ], choices: [
      { x: "둘에게 맡긴다.", to: "e3" },
      { x: "직접 마이크를 잡고 종례 방송을 한다.", to: "e3", set: "self" },
      { x: "테이프를 데크에 넣고, 두 사람의 이름도 부른다.", to: "e4", if: "asked", special: true }
    ]},

    e3: { time: "22:00", place: "정문", ending: "e3", body: [
      { p: "도훈이 페이더를 올린다. 지훈이 마이크 앞에 서고, 도훈이 그 옆에서 지훈의 어깨에 손을 얹는다.", ifnot: "self" },
      { s: "jh", x: "야간자율학습을 종료합니다. 모두 귀가하세요.", ifnot: "self" },
      { p: "내가 마이크를 잡는다. 스피커 속의 내가 숫자 세기를 멈춘다. 도훈이 볼륨을 올려주고, 지훈이 고개를 끄덕인다.", if: "self" },
      { s: "me", x: "야간자율학습을 종료합니다. 모두 귀가하십시오.", if: "self" },
      { p: "종이 울린다. 열 번. 정확히 열 번." },
      { p: "정신을 차리니 정문 앞이다. 22시 00분. 경비실 불이 켜져 있다. 운동장은 다시 인조잔디다." },
      { p: "다음 날, 3학년 2반에 김도훈이라는 학생은 없다. 댄스부 명단에도 한지훈은 없다. 아무도 그 이름을 모른다." },
      { p: "별관 앞 화단에 작은 추모 명판이 있다. 1997. 11. 14. 이름 두 개가 나란히 새겨져 있다." },
      { p: "주머니에 카세트테이프가 남아 있다. 우리 집에는 카세트 플레이어가 없다. 아직 틀어보지 못했다." },
      { p: "자습실 서랍에 쪽지가 한 장 더 들어 있다." },
      { note: `<p class="h-dh">잘 들어갔냐. 야자 끝나면 바로 가. 그게 제일 안전함. —도훈</p><p class="h-jh">선배 오늘 진짜 고생 많았어요. 오늘은 꼭 푹 자요. —지훈</p><p><span class="h-jh side">(도룽이형 글씨 끝까지 못 씀)</span></p><p><span class="h-dh side-dh">뭐래 --</span></p>` }
    ]},

    e4: { time: "22:00", place: "정문", ending: "e4", body: [
      { p: "나는 테이프를 데크에 넣는다. 도훈이 아무 말 없이 재생 버튼을 같이 누른다." },
      { p: "지직거리는 소리 끝에 기타가 들어온다. 그 위로 박자를 세는 목소리. 29년 전의 지훈이다." },
      { tape: "원, 투, 쓰리, 포!" },
      { p: "스피커 속의 내가 숫자를 세다 멈춘다. 음악이 그 목소리를 덮는다." },
      { p: "나는 마이크를 잡는다." },
      { s: "me", x: "야간자율학습을 종료합니다. 모두 귀가하십시오." },
      { s: "me", x: "1997학년도 3학년 2반 김도훈 학생, 2학년 4반 한지훈 학생도 귀가하십시오." },
      { p: "합주가 끝난다. 테이프 끝에 녹음된 소리가 조금 더 남아 있다." },
      { tape: "형, 박자 틀렸어요." },
      { tape: "니가 빨랐어." },
      { p: "지금의 지훈이 그걸 듣고 웃는다. 그러다 눈가가 빨개진다." },
      { s: "jh", x: "……형. 우리 이름 불렸어요." },
      { s: "dh", x: "들었어." },
      { p: "도훈은 잠깐 아무 말도 하지 않다가, 지훈의 머리를 한 번 헝클고 그대로 어깨에 팔을 두른다." },
      { s: "dh", x: "울지 마. ……아니다, 울어도 돼. 오늘은." },
      { s: "jh", x: "형이 기다려준 거, 고마웠어요. 29년 동안." },
      { s: "dh", x: "기다린 거 아니라니까. 같이 있던 거지." },
      { s: "jh", x: "선배, 그 테이프 가져요. 저희 무대, 누구 한 명은 끝까지 봐줬으면 했거든요." },
      { p: "둘은 나에게 고개를 꾸벅 숙인다. 지훈은 한 번 더 돌아보고 웃는다. 그리고 둘은 연결통로 쪽으로 나란히 걸어간다. 발소리가 점점 작아진다." },
      { p: "종이 열 번 울린다. 정문 앞, 22시 00분." },
      { p: "다음 날, 별관 앞 추모 명판 아래에 누군가 국화 두 송이를 두고 갔다. 내 서랍에는 마지막 쪽지가 있다." },
      { note: `<p class="h-dh">고맙다. 집에 간다.</p><p class="h-dh sig">—97년 3학년 2반 김도훈</p><p class="h-jh">선배 덕분에 형이랑 같이 가요. 잊지 않을게요.</p><p class="h-jh sig">—2학년 4반 한지훈</p>` },
      { p: "그 주말, 나는 중고 카세트 플레이어를 샀다. 테이프는 마지막 동작이 끝나는 곳에서 멈춘다. 이번에는 박자가 맞는다." },
      { p: "그 뒤로 세화고의 종은 열세 번 울리지 않았다." }
    ]}
  };

  /* ---------- 상태 ---------- */
  let name = "";
  let flags = {};
  let trail = [];
  let found = {};
  try { found = JSON.parse(localStorage.getItem("sehwa-endings") || "{}") || {}; } catch (e) {}

  const app = document.getElementById("app");
  const clockEl = document.getElementById("clock");
  const placeEl = document.getElementById("place");
  const hint = document.getElementById("hint");

  const esc = (s) => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const batchim = (s) => { const c = s.charCodeAt(s.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; };
  const fill = (t) => t.replace(/\{n(?::([^/}]+)\/([^}]+))?\}/g, (m, a, b) => esc(name) + (a ? (batchim(name) ? a : b) : ""));
  const ok = (it, f) => (!it.if || f[it.if]) && (!it.ifnot || !f[it.ifnot]);
  const WHO = { dh: "김도훈", jh: "한지훈" };
  const circ = ["①", "②", "③", "④"];
  const KEYS = Object.keys(ENDINGS);

  const io = ("IntersectionObserver" in window)
    ? new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -14% 0px", threshold: 0.15 })
    : null;
  if (!io) document.documentElement.classList.add("no-io");
  const watch = (root) => root.querySelectorAll(".rv").forEach(el => io && io.observe(el));

  function item(it) {
    if (it.p) return `<p class="rv">${fill(it.p)}</p>`;
    if (it.s) return `<div class="say ${it.s} rv"><span class="who">${it.s === "me" ? esc(name) : WHO[it.s]}</span><p class="line">${fill(it.x)}</p></div>`;
    if (it.sys) return `<div class="sys rv"><span class="tag">교내 방송</span><span class="jit">${fill(it.sys)}</span></div>`;
    if (it.voice) return `<p class="voice rv">${fill(it.voice)}</p>`;
    if (it.tape) return `<p class="tape rv"><span class="tag">테이프</span>${fill(it.tape)}</p>`;
    if (it.rule) return `<div class="rule rv"><span class="dept">세화고등학교 생활안전부 · 추가 수칙</span>${fill(it.rule)}</div>`;
    if (it.doc === "A") return `<div class="rv">${DOCS.A(false)}</div>`;
    if (it.doc === "A2") return `<div class="rv">${DOCS.A(true)}</div>`;
    if (it.doc === "B") return `<div class="rv">${DOCS.B()}</div>`;
    if (it.doc === "C") return `<div class="rv">${DOCS.C(esc(name))}</div>`;
    if (it.doc === "D") return `<div class="rv">${DOCS.D(esc(name))}</div>`;
    if (it.note) return `<div class="rv"><div class="paper note">${it.note}</div></div>`;
    return "";
  }

  function intro() {
    name = ""; flags = {}; trail = [];
    clockEl.textContent = "21:47"; placeEl.textContent = "세화고등학교";
    app.innerHTML = `
<section class="intro" id="intro">
  <div class="crest">${LOGO()}</div>
  <h1>세화고등학교</h1>
  <p>나는 세화고등학교 3학년이다. 오늘도 3층 자습실에서 야간자율학습이 끝나기를 기다리고 있다. 옆자리에는 친구 김도훈이, 뒷문 쪽에는 후배 한지훈이 있다. 1학년 때부터 알던 사이다. 그렇게 기억한다.</p>
  <p class="small">수칙은 서로 어긋난다. 어느 쪽을 믿을지는 내가 정한다. 결말은 다섯 개다.</p>
  <div class="field">
    <label for="pname">내 이름</label>
    <div class="field-row">
      <input id="pname" type="text" maxlength="8" autocomplete="off" value="">
      <button class="btn primary" id="start">자습실에 들어간다</button>
    </div>
    <div class="warn" id="warn"></div>
  </div>
  <div class="label">발견한 결말 ${KEYS.filter(k => found[k]).length} / ${KEYS.length}</div>
  <div class="endings">${KEYS.map((k, i) => `<div class="${found[k] ? "got" : ""}"><b>${i + 1}</b>${found[k] ? ENDINGS[k] : "？？？"}</div>`).join("")}</div>
  <p class="disclaimer">이 이야기에 나오는 학교, 사고, 인물은 모두 가상입니다.</p>
</section>`;
    const input = document.getElementById("pname");
    const btn = document.getElementById("start");
    const go = () => {
      const v = input.value.trim();
      if (!v) { document.getElementById("warn").textContent = "이름을 적어야 들어갈 수 있다."; input.focus(); return; }
      name = v; input.disabled = true; btn.disabled = true;
      document.getElementById("warn").textContent = "";
      append("s1");
    };
    btn.addEventListener("click", go);
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    window.scrollTo({ top: 0 });
    updateHint();
  }

  function append(id) {
    const sc = S[id];
    const snap = { ...flags };
    const sec = document.createElement("section");
    sec.className = "scene";
    sec.dataset.time = sc.time; sec.dataset.place = sc.place;
    let html = `<div class="scene-mark rv">${sc.time} · ${sc.place}</div>` + sc.body.filter(it => ok(it, flags)).map(item).join("");

    if (sc.ending) {
      found[sc.ending] = true;
      try { localStorage.setItem("sehwa-endings", JSON.stringify(found)); } catch (e) {}
      const idx = KEYS.indexOf(sc.ending) + 1;
      const good = sc.ending === "e3" || sc.ending === "e4";
      const kind = sc.ending === "e4" ? "진 결말" : (good ? "결말" : "배드 엔딩");
      html += `<div class="ending rv">
  <div class="stamp">${good ? "귀가<br>확인" : "미귀가"}</div>
  <div class="k">${kind} · ${idx} / ${KEYS.length}</div>
  <h2>${ENDINGS[sc.ending]}</h2>
  <div class="cnt">지금까지 발견한 결말 ${KEYS.filter(k => found[k]).length}개${sc.ending === "e3" ? " · 진 결말은 중간에 둘에게 직접 물어봐야 열린다." : ""}</div>
  <div class="end-actions"><button class="btn" data-act="back">직전 선택지로</button><button class="btn primary" data-act="restart">처음부터</button></div>
</div>`;
    } else {
      const ch = sc.choices.filter(c => ok(c, flags));
      html += `<ul class="choices rv"><li class="q">어떻게 할까.</li>` +
        ch.map((c, i) => `<li><button class="choice${c.special ? " special" : ""}" data-i="${i}"><span class="num">${circ[i]}</span><span>${fill(c.x)}</span></button></li>`).join("") + `</ul>`;
      sec._choices = ch;
    }
    sec.innerHTML = html;
    app.appendChild(sec);
    trail.push({ id, flags: snap, el: sec });

    sec.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
      if (b.disabled) return;
      const c = sec._choices[+b.dataset.i];
      sec.querySelectorAll(".choice").forEach(x => { x.disabled = true; });
      b.classList.add("picked");
      if (c.set) flags[c.set] = true;
      append(c.to);
    }));
    sec.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.act === "restart") return intro();
      const last = trail.pop(); last.el.remove();
      const prev = trail[trail.length - 1];
      if (!prev) return intro();
      flags = { ...prev.flags };
      prev.el.querySelectorAll(".choice").forEach(x => { x.disabled = false; x.classList.remove("picked"); });
      prev.el.querySelector(".choices").scrollIntoView({ behavior: "smooth", block: "center" });
    }));

    watch(sec);
    requestAnimationFrame(() => sec.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }));
    updateHint();
  }

  let ticking = false;
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      let cur = null;
      document.querySelectorAll(".scene").forEach(s => { if (s.getBoundingClientRect().top < window.innerHeight * 0.4) cur = s; });
      if (cur) { clockEl.textContent = cur.dataset.time; placeEl.textContent = "세화고등학교 · " + cur.dataset.place; }
      else { clockEl.textContent = "21:47"; placeEl.textContent = "세화고등학교"; }
      updateHint();
    });
  }
  function updateHint() { hint.hidden = !(io && app.querySelector(".scene .rv:not(.in)")); }
  window.addEventListener("scroll", onScroll, { passive: true });

  intro();
})();
</script>

</body>
</html>
